<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>整理助手</title>
<link rel="preload" href="assets/fonts/Inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<script>
  /* 首帧防白闪：只做主题镜像，真正的主题仍以配置为准（applyTheme 会覆盖这里） */
  try {
    var t = localStorage.getItem('ta.theme');
    if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
  } catch (e) { /* 隐私模式忽略 */ }
</script>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="nav-tip.css">
<link rel="stylesheet" href="dirview.css">
</head>
<body>
<div class="rz rz-n" data-resize="n"></div>
<div class="rz rz-s" data-resize="s"></div>
<div class="rz rz-e" data-resize="e"></div>
<div class="rz rz-w" data-resize="w"></div>
<div class="rz rz-ne" data-resize="ne"></div>
<div class="rz rz-nw" data-resize="nw"></div>
<div class="rz rz-se" data-resize="se"></div>
<div class="rz rz-sw" data-resize="sw"></div>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <path d="M8 12h8M8 15h5"/>
        </svg>
      </div>
      <div class="brand-text">
        <strong data-i18n="app.name">整理助手</strong>
        <span data-i18n="app.slogan">按类型收纳，一步到位</span>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <span class="dot" id="engine-dot"></span>
      <span id="engine-label" data-i18n="status.connecting">正在连接引擎…</span>
    </div>
  </aside>

  <main class="main">
    <header class="topbar" id="topbar">
      <div class="lead">
        <button class="btn ghost icon sm" id="sidebar-toggle" title="折叠/展开侧栏" aria-label="折叠侧栏">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="title-wrap">
          <h1 id="page-title">整理文件</h1>
          <p id="page-sub" class="sub"></p>
        </div>
      </div>
      <div class="top-actions" id="top-actions">
        <button class="btn ghost icon sm" id="btn-fullscreen" title="全屏 (F11)" aria-label="全屏">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        </button>
      </div>
      <div class="tb-pill" id="tb-pill">
        <button class="tb-btn" id="tb-min" title="最小化" aria-label="最小化">
          <svg viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M2.5 6h7"/></svg>
        </button>
        <button class="tb-btn" id="tb-max" title="最大化" aria-label="最大化">
          <svg viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><rect x="2.5" y="2.5" width="7" height="7" rx="1"/></svg>
        </button>
        <button class="tb-btn tb-close" id="tb-close" title="关闭" aria-label="关闭">
          <svg viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="m3 3 6 6M9 3 3 9"/></svg>
        </button>
      </div>
    </header>
    <div class="scroll" id="scroll">
      <div id="page" class="page-host"></div>
    </div>
  </main>
</div>

<div id="overlay" class="overlay" hidden>
  <div class="overlay-box">
    <span id="overlay-ic" class="ldr ldr-spin" aria-hidden="true"></span>
    <div>
      <div id="overlay-text">正在处理…</div>
      <div class="overlay-bar" aria-hidden="true"></div>
    </div>
  </div>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="modal-root"></div>
<div id="ctx-root"></div>
<div id="preview-root"></div>

<script src="js/boot-guard.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/titlebar.js"></script>
  <script src="js/ai/steve.js"></script>
  <script src="js/ai/prompt.js"></script>
  <script src="js/ai/md.js"></script>
  <script src="js/ai/guard.js"></script>
  <script src="js/ai/registry.js"></script>
  <script src="js/ai/proposals.js"></script>
  <script src="js/ai/tools.js"></script>
  <script src="js/ai/agent.js"></script>
  <script src="js/ai/store.js"></script>
  <script src="js/ai/strength.js"></script>
  <script src="js/ai/pool.js"></script>
  <script src="js/ai/motion.js"></script>
  <script src="js/ai/procs.js"></script>
  <script src="js/ai/follow.js"></script>
  <script src="js/ai/turnrail.js"></script>
  <script src="js/ai/effort.js"></script>
  <script src="js/ai/composer.js"></script>
  <script src="js/ai/entries.js"></script>
  <script src="js/ai/chatui.js"></script>
  <script src="js/ai/drawer.js"></script>
  <script src="js/pages/ai.js"></script>
<script src="js/pages/organize.js"></script>
<script src="js/pages/shots.js"></script>
<script src="js/pages/cache.js"></script>
<script src="js/dirview.js"></script>
  <script src="js/pages/tools.js"></script>
<script src="js/pages/archive.js"></script>
<script src="js/pages/search.js"></script>
<script src="js/pages/rules.js"></script>
<script src="js/pages/apps.js"></script>
<script src="js/pages/migrate.js"></script>
<script src="js/pages/log.js"></script>
<script src="js/pages/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
