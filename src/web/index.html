              <stop offset="0%" stop-color="#2E2C27"/>
              <stop offset="55%" stop-color="#191815"/>

            </linearGradient>
            <linearGradient id="qd-ring" x1="16" y1="12" x2="46" y2="50" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#FFFDF9"/>
              <stop offset="100%" stop-color="#DDD6C9"/>

            <linearGradient id="qd-tail" x1="34" y1="34" x2="52" y2="52" gradientUnits="userSpaceOnUse">

              <stop offset="55%" stop-color="#E85A2C"/>

          </defs>

      </div>

        <span class="brand-cn" data-i18n="app.name">轻盘</span>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <span class="dot" id="engine-dot"></span>

      <button class="sidebar-theme-btn" id="theme-quick-btn" type="button" title="切换浅色 / 深色外观" aria-label="切换浅色或深色外观"></button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar" id="topbar">
      <div class="lead">

          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="title-wrap">
          <h1 id="page-title">整理文件</h1>
          <p id="page-sub" class="sub"></p>
        </div>
      </div>
      <div class="top-actions" id="top-actions"></div>
      <div class="tb-pill" id="tb-pill">
        <button class="tb-btn" id="tb-min" title="最小化" aria-label="最小化">
          <svg viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M2.5 6h7"/></svg>
        </button>

        </button>
        <button class="tb-btn tb-close" id="tb-close" title="关闭" aria-label="关闭">
          <svg viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="m3 3 6 6M9 3 3 9"/></svg>
        </button>
      </div>
    </header>
    <div class="scroll" id="scroll">
      <div id="page" class="page-host"></div>
    </div>
  </main>

<div id="overlay" class="overlay" hidden>
