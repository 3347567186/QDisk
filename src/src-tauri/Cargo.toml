[package]
name = "tidy-assistant"
version = "1.42.12"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
tauri-plugin-single-instance = "2"
anyhow = "1"
bzip2 = "0.6"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
libloading = "0.8"
lzma-rust2 = "0.25"
sevenz-rust2 = { version = "0.25", features = ["compress", "util", "aes256", "bzip2"] }
sha2 = "0.10"
tar = "0.4"
walkdir = "2.5"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Globalization", "Win32_Networking_WinHttp", "Win32_System_Time"] }
zip = { version = "9.6", default-features = false, features = ["deflate-flate2", "aes-crypto", "bzip2", "xz", "time"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true


