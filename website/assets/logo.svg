<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Obsidian charcoal squircle body -->
    <radialGradient id="bg" cx="35%" cy="18%" r="92%">
      <stop offset="0%" stop-color="#2E2C27"/>
      <stop offset="52%" stop-color="#1A1917"/>
      <stop offset="100%" stop-color="#0F0F0D"/>
    </radialGradient>
    <!-- Subtle top-lit specular inner rim -->
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <!-- Warm ivory precision disk ring -->
    <linearGradient id="disk" x1="20%" y1="10%" x2="82%" y2="88%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="58%" stop-color="#F2EEE6"/>
      <stop offset="100%" stop-color="#DDD7CA"/>
    </linearGradient>
    <!-- Signature terracotta-vermilion Q-slash -->
    <linearGradient id="slash" x1="10%" y1="10%" x2="92%" y2="92%">
      <stop offset="0%" stop-color="#FF8B62"/>
      <stop offset="50%" stop-color="#EC5C32"/>
      <stop offset="100%" stop-color="#C43B16"/>
    </linearGradient>
    <!-- Soft warm ambient glow behind the slash -->
    <radialGradient id="glow" cx="68%" cy="68%" r="44%">
      <stop offset="0%" stop-color="#EE6136" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#EE6136" stop-opacity="0"/>
    </radialGradient>
    <!-- Subtle drop shadow for floating disk depth -->
    <filter id="elev" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Continuous rounded squircle base -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#glow)"/>
  <rect x="23" y="23" width="466" height="466" rx="109" fill="none" stroke="url(#rim)" stroke-width="5"/>

  <!-- Precision subtle concentric platter track -->
  <circle cx="244" cy="242" r="80" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2.5"/>

  <!-- Floating Warm-Ivory Open Disk Ring (clean precision gap at lower-right for the Q-tail) -->
  <g filter="url(#elev)">
    <path
      d="M 340.5 316.0
         A 122 122 0 1 1 358.2 285.5"
      fill="none"
      stroke="url(#disk)"
      stroke-width="46"
      stroke-linecap="round"/>

    <!-- Center spindle jewel -->
    <circle cx="244" cy="242" r="24" fill="#2A2824" stroke="#F4F0E8" stroke-opacity="0.22" stroke-width="4"/>
    <circle cx="244" cy="242" r="8.5" fill="url(#slash)"/>

    <!-- Bold Sculptural Terracotta Q-Slash / Swept Tail -->
    <path
      d="M 278 276 L 378 376"
      fill="none"
      stroke="url(#slash)"
      stroke-width="48"
      stroke-linecap="round"/>
  </g>
</svg>
