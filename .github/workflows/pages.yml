name: Deploy Official Website (GitHub Pages)

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - "docs/assets/screenshots/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble static site with runtime screenshots
        run: |
          mkdir -p _site/assets/screenshots
          cp -r website/* _site/
          cp -r docs/assets/screenshots/* _site/assets/screenshots/
          curl -fsSL "https://github.com/${{ github.repository }}/releases/latest/download/latest.json" -o _site/latest.json || true
          touch _site/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
